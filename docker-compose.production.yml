services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_HOST: financeit.i2r.tech
      APP_HOSTS: financeit.i2r.tech
      PORT: 80
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      SOLID_QUEUE_IN_PUMA: "true"
    ports:
      - "3000:80"
    volumes:
      - rails_storage:/rails/storage

volumes:
  rails_storage:
